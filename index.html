<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma — Egrégora Cria Ti na Luz · Portugal 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ── RESET & TOKENS ─────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #fefcfb;
    --surface:    #ffffff;
    --border:     #e8e4df;
    --border-soft:#f0ece8;

    --navy:       #1b4f8a;
    --blue-mid:   #2e73c2;
    --blue-bright:#4a9fe8;
    --blue-soft:  #7ec8f5;
    --blue-pale:  #daeef9;
    --blue-ghost: #f0f7fd;

    --ink:        #0f1f35;
    --ink-mid:    #2d4a6e;
    --ink-soft:   #5b7fa6;
    --ink-muted:  #8fa8c4;

    --gold:       #c8a95a;
    --gold-pale:  #faf3e4;

    --shadow-sm:  0 1px 3px rgba(27,79,138,.07), 0 1px 2px rgba(27,79,138,.04);
    --shadow-md:  0 4px 16px rgba(27,79,138,.08), 0 1px 4px rgba(27,79,138,.04);
    --shadow-lg:  0 12px 40px rgba(27,79,138,.10), 0 2px 8px rgba(27,79,138,.05);

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 24px;
    --r-pill: 999px;

    --font-display: 'DM Serif Display', Georgia, serif;
    --font-body:    'Outfit', sans-serif;
    --font-mono:    'DM Mono', monospace;
  }

  html { font-size: 16px; scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 0.9375rem;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── PRINT ──────────────────────────────────────────────────── */
  @media print {
    body { font-size: 10pt; }
    .no-print { display: none !important; }
    .page-break { page-break-before: always; }
    .card { break-inside: avoid; }
    header { page-break-after: avoid; }
  }

  /* ── LAYOUT ─────────────────────────────────────────────────── */
  .wrapper {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
  }

  /* ── HEADER / CAPA ──────────────────────────────────────────── */
  header {
    background: linear-gradient(155deg, #0d2b52 0%, #1b4f8a 45%, #1e6b9e 100%);
    color: #fff;
    padding: 4rem 2rem 3.5rem;
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(90deg, rgba(13,43,82,.92) 0%, rgba(13,43,82,.72) 48%, rgba(13,43,82,.25) 100%),
      radial-gradient(ellipse 70% 60% at 80% 20%, rgba(74,159,232,.22) 0%, transparent 65%),
      radial-gradient(ellipse 50% 40% at 10% 85%, rgba(30,107,158,.3) 0%, transparent 60%);
    pointer-events: none;
  }

  /* star field */
  header::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 12% 18%, rgba(200,232,255,.55) 0%, transparent 100%),
      radial-gradient(1px 1px at 28% 72%, rgba(200,232,255,.4) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 45% 35%, rgba(200,232,255,.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 63% 58%, rgba(200,232,255,.35) 0%, transparent 100%),
      radial-gradient(1px 1px at 77% 15%, rgba(200,232,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 88% 80%, rgba(200,232,255,.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 5%  55%, rgba(200,232,255,.3) 0%, transparent 100%),
      radial-gradient(1.5px 1.5px at 52% 88%, rgba(200,232,255,.45) 0%, transparent 100%),
      radial-gradient(1px 1px at 35% 10%, rgba(200,232,255,.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 42%, rgba(200,232,255,.35) 0%, transparent 100%);
    pointer-events: none;
  }

  .header-inner {
    position: relative;
    z-index: 1;
    max-width: 860px;
    margin: 0 auto;
  }

  .header-top {
    display: flex;
    align-items: center;
    gap: .8rem;
    flex-wrap: wrap;
    margin-bottom: 1.6rem;
  }

  .brand-lockup {
    display: inline-flex;
    align-items: center;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: 22px;
    padding: .55rem;
    box-shadow: 0 14px 34px rgba(2,16,32,.18);
    backdrop-filter: blur(10px);
  }

  .brand-logo {
    width: 64px;
    height: 64px;
    object-fit: contain;
    border-radius: 50%;
    background: rgba(255,255,255,.92);
    padding: .2rem;
    box-shadow: 0 0 0 5px rgba(255,255,255,.09), 0 10px 22px rgba(0,0,0,.18);
    flex-shrink: 0;
  }

  .brand-mark {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background:
      radial-gradient(circle at 50% 45%, rgba(255,255,255,.95) 0 10%, transparent 11%),
      conic-gradient(from 25deg, #7ec8f5, #faf3e4, #c8a95a, #4a9fe8, #7ec8f5);
    box-shadow: 0 0 0 5px rgba(255,255,255,.09), 0 10px 22px rgba(0,0,0,.18);
    position: relative;
    flex-shrink: 0;
  }

  .brand-mark::before,
  .brand-mark::after {
    content: '';
    position: absolute;
    background: rgba(13,43,82,.78);
    border-radius: 999px;
  }

  .brand-mark::before { width: 2px; height: 28px; }
  .brand-mark::after { width: 28px; height: 2px; }

  .brand-copy {
    display: grid;
    gap: .05rem;
  }

  .brand-name {
    font-family: var(--font-display);
    font-size: 1.2rem;
    line-height: 1;
    color: #fff;
  }

  .brand-kicker {
    font-size: .68rem;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--blue-soft);
  }

  .header-pill {
    display: inline-flex;
    align-items: center;
    gap: .45rem;
    background: rgba(255,255,255,.1);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: var(--r-pill);
    padding: .3rem .9rem;
    font-size: .78rem;
    font-weight: 600;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--blue-soft);
    backdrop-filter: blur(4px);
  }

  .header-pill span { opacity: .6; }

  header h1 {
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 6vw, 3.6rem);
    line-height: 1.08;
    font-weight: 400;
    color: #fff;
    margin-bottom: .5rem;
  }

  header h1 em {
    font-style: italic;
    color: var(--blue-soft);
  }

  .header-sub {
    font-size: 1.05rem;
    font-weight: 300;
    color: rgba(179,221,245,.85);
    margin-bottom: 2.2rem;
    letter-spacing: .01em;
  }

  .header-meta {
    display: flex;
    flex-wrap: wrap;
    gap: .6rem;
  }

  .header-actions {
    display: flex;
    flex-wrap: wrap;
    gap: .75rem;
    margin: 0 0 1.7rem;
  }

  .meta-chip {
    display: inline-flex;
    align-items: center;
    gap: .4rem;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    border-radius: var(--r-pill);
    padding: .35rem .85rem;
    font-size: .8rem;
    font-weight: 500;
    color: rgba(255,255,255,.85);
    backdrop-filter: blur(4px);
  }

  .meta-chip svg { opacity: .65; flex-shrink: 0; }

  .map-chip {
    text-decoration: none;
    cursor: pointer;
    transition: background .2s, transform .15s, border-color .2s;
  }

  .map-chip:hover {
    background: rgba(255,255,255,.14);
    border-color: rgba(255,255,255,.24);
    transform: translateY(-1px);
  }

  .footer-map-link {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
  }

  .footer-map-link:hover { color: var(--navy); }

  .primary-cta,
  .whatsapp-button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    border-radius: var(--r-pill);
    font-family: var(--font-body);
    font-weight: 800;
    text-decoration: none;
    line-height: 1;
    white-space: nowrap;
    transition: transform .15s, box-shadow .2s, border-color .2s, background .2s;
  }

  .primary-cta {
    background: linear-gradient(135deg, #f7d77b, #c8a95a);
    color: #0d2b52;
    border: 1px solid rgba(255,255,255,.55);
    padding: .9rem 1.25rem;
    font-size: .86rem;
    letter-spacing: .04em;
    text-transform: uppercase;
    box-shadow: 0 14px 28px rgba(0,0,0,.18), 0 0 0 4px rgba(255,255,255,.1);
  }

  .whatsapp-button {
    background: #23c063;
    color: #fff;
    border: 1px solid rgba(255,255,255,.36);
    padding: .86rem 1.1rem;
    font-size: .84rem;
    box-shadow: 0 12px 26px rgba(0,0,0,.14);
  }

  .primary-cta:hover,
  .whatsapp-button:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 34px rgba(0,0,0,.2);
  }

  .primary-cta:active,
  .whatsapp-button:active {
    transform: translateY(0) scale(.98);
  }

  .button-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }

  /* stats bar */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: rgba(255,255,255,.08);
    border-radius: var(--r-md);
    overflow: hidden;
    margin-top: 2.5rem;
    border: 1px solid rgba(255,255,255,.1);
  }

  .stat-item {
    background: rgba(13,43,82,.55);
    backdrop-filter: blur(8px);
    padding: 1rem 1.2rem;
    text-align: center;
  }

  .stat-num {
    font-family: var(--font-mono);
    font-size: 1.65rem;
    font-weight: 500;
    color: #fff;
    line-height: 1;
    margin-bottom: .3rem;
  }

  .stat-label {
    font-size: .72rem;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--blue-soft);
    opacity: .85;
  }

  /* ── MAIN CONTENT ────────────────────────────────────────────── */
  main { padding-top: 3rem; }

  /* ── SECTION ─────────────────────────────────────────────────── */
  .section { margin-bottom: 3rem; }

  /* ── INTRO BLOCK ─────────────────────────────────────────────── */
  .intro-block {
    border-left: 3px solid var(--blue-bright);
    padding: 1.4rem 1.6rem;
    background: var(--surface);
    border-radius: 0 var(--r-md) var(--r-md) 0;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1.8rem;
  }

  .intro-block p {
    color: var(--ink-mid);
    font-size: .93rem;
    line-height: 1.75;
    font-weight: 400;
  }

  .intro-block p + p { margin-top: .75rem; }

  /* ── PILARES GRID ────────────────────────────────────────────── */
  .pilares-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: .75rem;
    margin-bottom: 1.8rem;
  }

  .pilar-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: var(--r-md);
    padding: 1rem 1rem .9rem;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: .5rem;
    transition: box-shadow .2s, border-color .2s, transform .2s;
    cursor: default;
  }

  .pilar-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--blue-pale);
    transform: translateY(-2px);
  }

  .pilar-icon {
    width: 36px; height: 36px;
    border-radius: var(--r-sm);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .pilar-label {
    font-size: .8rem;
    font-weight: 600;
    color: var(--ink-mid);
    line-height: 1.3;
  }

  /* ── FICHARIO ─────────────────────────────────────────────────── */
  .fichario {
    background: var(--blue-ghost);
    border: 2px solid var(--navy);
    border-radius: var(--r-md);
    padding: 1.2rem 1.5rem;
    display: flex;
    gap: 1.2rem;
    align-items: flex-start;
    margin-bottom: 2rem;
  }

  .fichario-icon {
    font-size: 1.8rem;
    line-height: 1;
    flex-shrink: 0;
    margin-top: .1rem;
  }

  .fichario-text strong {
    display: block;
    font-size: .9rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: .35rem;
  }

  .fichario-text p {
    font-size: .82rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── MONTH BADGE ─────────────────────────────────────────────── */
  .month-badge {
    display: flex;
    align-items: center;
    gap: .85rem;
    padding: .85rem 1.3rem;
    border-radius: var(--r-pill);
    color: #fff;
    margin-bottom: 1.1rem;
    position: relative;
    overflow: hidden;
  }

  .month-badge::after {
    content: '';
    position: absolute;
    right: -20px; top: -20px;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
    pointer-events: none;
  }

  .badge-emoji {
    font-size: 1.3rem;
    line-height: 1;
    flex-shrink: 0;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,.2));
  }

  .badge-text { flex: 1; }

  .badge-title {
    font-size: .92rem;
    font-weight: 700;
    letter-spacing: .03em;
    line-height: 1.2;
  }

  .badge-sub {
    font-size: .73rem;
    font-weight: 400;
    opacity: .78;
    margin-top: .1rem;
  }

  .badge-count {
    font-family: var(--font-mono);
    font-size: .78rem;
    background: rgba(255,255,255,.15);
    border: 1px solid rgba(255,255,255,.2);
    border-radius: var(--r-pill);
    padding: .2rem .65rem;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── CARD ────────────────────────────────────────────────────── */
  .cards-stack { display: flex; flex-direction: column; gap: .65rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    display: grid;
    grid-template-columns: 4px 52px 1fr;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: box-shadow .2s, transform .2s;
  }

  .card:hover {
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  /* color bar */
  .card-bar { width: 4px; }

  /* number circle */
  .card-num {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 .5rem;
    border-right: 1px solid var(--border-soft);
  }

  .num-circle {
    width: 28px; height: 28px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem;
    font-weight: 700;
    color: #fff;
    font-family: var(--font-mono);
    flex-shrink: 0;
  }

  /* card body */
  .card-body {
    padding: .9rem 1.1rem .85rem 1rem;
    display: flex;
    flex-direction: column;
    gap: .45rem;
    min-width: 0;
  }

  .card-top {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: .45rem;
  }

  .card-date {
    font-size: .82rem;
    font-weight: 700;
    color: var(--ink-mid);
    flex-shrink: 0;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    border-radius: var(--r-pill);
    padding: .18rem .65rem;
    font-size: .72rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .pill-hora {
    border: 1.5px solid;
    background: transparent;
  }

  .pill-mod {
    background: #f0ece8;
    color: var(--ink-soft);
    font-weight: 500;
  }

  .pill-obs {
    margin-left: auto;
    background: var(--gold-pale);
    color: #8a6a20;
    font-style: italic;
    font-weight: 400;
    font-size: .7rem;
  }

  .calendar-button {
    display: inline-flex;
    align-items: center;
    gap: .35rem;
    margin-left: auto;
    border: 1px solid var(--blue-pale);
    background: var(--blue-ghost);
    color: var(--navy);
    border-radius: var(--r-pill);
    padding: .28rem .7rem;
    font-family: var(--font-body);
    font-size: .7rem;
    font-weight: 700;
    line-height: 1;
    cursor: pointer;
    transition: background .2s, border-color .2s, transform .15s, box-shadow .2s;
  }

  .calendar-button:hover {
    background: #fff;
    border-color: var(--blue-mid);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .calendar-button:active {
    transform: translateY(0) scale(.98);
  }

  .card-tema {
    font-size: .88rem;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
  }

  .card-desc {
    font-size: .78rem;
    color: var(--ink-soft);
    line-height: 1.55;
  }

  /* ── INFO CARD (pausa / retorno) ─────────────────────────────── */
  .info-card {
    background: var(--ink);
    border-radius: var(--r-md);
    padding: 1.1rem 1.4rem;
    display: grid;
    grid-template-columns: 4px auto 1fr;
    gap: 0 1rem;
    align-items: center;
    box-shadow: var(--shadow-md);
  }

  .info-bar { width: 4px; border-radius: 4px; align-self: stretch; }

  .info-emoji {
    font-size: 1.5rem;
    line-height: 1;
  }

  .info-content {}

  .info-title {
    font-size: .88rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    margin-bottom: .2rem;
  }

  .info-sub {
    font-size: .76rem;
    color: var(--blue-pale);
    opacity: .8;
  }

  /* ── ONLINE CARD ─────────────────────────────────────────────── */
  .online-card {
    background: var(--surface);
    border: 2px solid var(--blue-bright);
    border-radius: var(--r-md);
    padding: 1.2rem 1.4rem;
    display: flex;
    gap: 1.1rem;
    align-items: flex-start;
    box-shadow: var(--shadow-sm);
    margin-bottom: 1rem;
  }

  .online-card .oi-emoji { font-size: 1.7rem; line-height: 1; flex-shrink: 0; margin-top: .1rem; }

  .online-card strong {
    display: block;
    font-size: .9rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: .4rem;
  }

  .online-card p {
    font-size: .83rem;
    color: var(--ink-soft);
    line-height: 1.65;
  }

  /* ── ATIVIDADES ROW ──────────────────────────────────────────── */
  .atv-row {
    display: flex;
    gap: .5rem;
    flex-wrap: wrap;
    margin-top: .5rem;
  }

  .atv-chip {
    background: var(--bg);
    border: 1.2px solid var(--blue-pale);
    border-radius: var(--r-sm);
    padding: .4rem .8rem;
    font-size: .76rem;
    font-weight: 500;
    color: var(--navy);
  }

  /* ── SECTION TITLE ───────────────────────────────────────────── */
  .section-title {
    display: flex;
    align-items: center;
    gap: .7rem;
    margin-bottom: 1.2rem;
    padding-bottom: .7rem;
    border-bottom: 1.5px solid var(--border);
  }

  .section-title h2 {
    font-family: var(--font-display);
    font-size: 1.35rem;
    font-weight: 400;
    color: var(--navy);
    line-height: 1.2;
  }

  .section-title .accent-line {
    height: 2px;
    flex: 1;
    background: linear-gradient(90deg, var(--blue-pale) 0%, transparent 100%);
    border-radius: 1px;
  }

  /* ── OBS LIST ────────────────────────────────────────────────── */
  .obs-list { display: flex; flex-direction: column; gap: .55rem; }

  .obs-item {
    display: flex;
    gap: .75rem;
    align-items: flex-start;
    padding: .7rem .9rem;
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: var(--r-sm);
    box-shadow: var(--shadow-sm);
  }

  .obs-emoji { font-size: 1rem; line-height: 1.5; flex-shrink: 0; }

  .obs-text {
    font-size: .84rem;
    color: var(--ink-soft);
    line-height: 1.6;
  }

  /* ── CITACAO FINAL ───────────────────────────────────────────── */
  .quote-block {
    background: var(--ink);
    border-radius: var(--r-lg);
    padding: 3rem 2.5rem;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    margin-bottom: 2.5rem;
  }

  .quote-block::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 50% at 20% 30%, rgba(46,115,194,.2) 0%, transparent 65%),

<script>
  (() => {
    const saved = localStorage.getItem('criaTiAdminConfig');
    if (!saved) return;

    let config;
    try {
      config = JSON.parse(saved);
    } catch (error) {
      console.warn('Configuração da página inválida.', error);
      return;
    }

    const setText = (selector, value) => {
      if (!value) return;
      const element = document.querySelector(selector);
      if (element) element.textContent = value;
    };

    const setHref = (selector, value) => {
      if (!value) return;
      document.querySelectorAll(selector).forEach((element) => {
        element.href = value;
      });
    };

    const setTextWithinSelector = (selector, value) => {
      if (value === undefined || value === null) return;
      document.querySelectorAll(selector).forEach((element) => {
        element.textContent = value;
      });
    };

    const escapeHtml = (value) => String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    const buildWhatsAppLink = () => {
      const message = encodeURIComponent(config.whatsappMessage || 'Tenho interesse no Curso de Desenvolvimento Psicoespiritual da Egrégora Cria Ti na Luz em Portugal.');
      const number = String(config.whatsappNumber || '').replace(/\D/g, '');
      return number ? `https://wa.me/${number}?text=${message}` : `https://wa.me/5511972075438?text=${message}`;
    };

    setText('.header-sub', config.headerSubtitle);

    if (config.headerTitleMain || config.headerTitleHighlight) {
      const h1 = document.querySelector('header h1');
      const mainTitle = config.headerTitleMain || 'Egrégora';
      const highlight = config.headerTitleHighlight || 'Cria Ti na Luz';
      if (h1) h1.innerHTML = `${escapeHtml(mainTitle)}<br><em>${escapeHtml(highlight)}</em>`;
    }

    setText('.intro-block p:nth-child(1)', config.intro1);
    setText('.intro-block p:nth-child(2)', config.intro2);
    setText('.final-cta h3', config.finalTitle);
    setText('.final-cta p', config.finalText);

    if (config.contentOverrides && typeof config.contentOverrides === 'object') {
      Object.entries(config.contentOverrides).forEach(([selector, value]) => {
        setTextWithinSelector(selector, value);
      });
    }

    if (config.formUrl) {
      setHref('a[href*="forms.gle"], a[href*="docs.google.com/forms"]', config.formUrl);
    }

    if (config.whatsappNumber || config.whatsappMessage) {
      setHref('.whatsapp-button', buildWhatsAppLink());
    }

    if (config.address) {
      const mapQuery = encodeURIComponent(config.address);
      const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;
      const headerAddress = document.querySelector('.header-meta .map-chip');
      const footerAddress = document.querySelector('.footer-map-link');

      if (headerAddress) {
        const svg = headerAddress.querySelector('svg')?.outerHTML || '';
        headerAddress.innerHTML = `${svg}\n        ${config.address}`;
        headerAddress.href = mapUrl;
      }

      if (footerAddress) {
        footerAddress.textContent = config.address;
        footerAddress.href = mapUrl;
      }
    }

    if (Array.isArray(config.events)) {
      const cardsByNumber = new Map([...document.querySelectorAll('.card')].map((card) => {
        return [card.querySelector('.num-circle')?.textContent.trim(), card];
      }));

      config.events.forEach((event) => {
        const card = cardsByNumber.get(String(event.number).padStart(2, '0'));
        const targetStack = card?.closest('.cards-stack');
        if (card && targetStack) targetStack.appendChild(card);
      });

      config.events.forEach((event) => {
        if (!event.number) return;

        const card = [...document.querySelectorAll('.card')].find((item) => {
          return item.querySelector('.num-circle')?.textContent.trim() === String(event.number).padStart(2, '0');
        });
        if (!card) return;

        setTextWithin(card, '.card-date', event.date);
        setTextWithin(card, '.pill-hora', event.time);
        setTextWithin(card, '.card-tema', event.title);
        setTextWithin(card, '.card-desc', event.description);
        setTextWithin(card, '.pill-mod', event.mode);

        const note = card.querySelector('.pill-obs');
        if (event.note) {
          if (note) {
            note.textContent = event.note;
          } else {
            const newNote = document.createElement('span');
            newNote.className = 'pill pill-obs';
            newNote.textContent = event.note;
            card.querySelector('.card-top')?.appendChild(newNote);
          }
        } else if (note) {
          note.remove();
        }
      });
    }

    function setTextWithin(parent, selector, value) {
      if (!value) return;
      const element = parent.querySelector(selector);
      if (element) element.textContent = value;
    }
  })();
</script>

<script>
  (() => {
    const monthMap = {
      janeiro: 0,
      fevereiro: 1,
      marco: 2,
      março: 2,
      abril: 3,
      maio: 4,
      junho: 5,
      julho: 6,
      agosto: 7,
      setembro: 8,
      outubro: 9,
      novembro: 10,
      dezembro: 11
    };

    const location = 'Rua Nau São Gabriel, nº 102, 4610-485 Felgueiras, Portugal';
    const calendarName = 'Egrégora Cria Ti na Luz';
    let savedCalendarConfig = {};
    try {
      savedCalendarConfig = JSON.parse(localStorage.getItem('criaTiAdminConfig') || '{}');
    } catch (error) {
      savedCalendarConfig = {};
    }
    const calendarButtonText = savedCalendarConfig.calendarButtonText
      || savedCalendarConfig.contentOverrides?.['.calendar-button']
      || '+ Adicionar à agenda';

    const normalize = (value) => value
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();

    const pad = (value) => String(value).padStart(2, '0');

    const formatIcsDate = (date) => {
      return [
        date.getFullYear(),
        pad(date.getMonth() + 1),
        pad(date.getDate())
      ].join('') + 'T' + [
        pad(date.getHours()),
        pad(date.getMinutes()),
        '00'
      ].join('');
    };

    const escapeIcs = (value) => String(value)
      .replace(/\\/g, '\\\\')
      .replace(/;/g, '\\;')
      .replace(/,/g, '\\,')
      .replace(/\r?\n/g, '\\n');

    const slugify = (value) => normalize(value)
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-|-$/g, '')
      .slice(0, 70);

    const parseEventDate = (dateText, timeText) => {
      if (!dateText) return null;

      const dateMatch = dateText.match(/(\d{1,2})\s+de\s+([A-Za-zÀ-ÿ]+)/);
      if (!dateMatch) return null;

      const day = Number(dateMatch[1]);
      const month = monthMap[normalize(dateMatch[2])];
      if (month === undefined) return null;

      const timeMatch = String(timeText || '').match(/(\d{1,2})h(?:(\d{2}))?/i);
      if (!timeMatch || /confirmar/i.test(timeText || '')) {
        return { start: new Date(2026, month, day, 0, 0, 0), allDay: true };
      }

      const hour = Number(timeMatch[1]);
      const minute = Number(timeMatch[2] || 0);
      return { start: new Date(2026, month, day, hour, minute, 0), allDay: false };
    };

    const formatIcsDay = (date) => [
      date.getFullYear(),
      pad(date.getMonth() + 1),
      pad(date.getDate())
    ].join('');

    const buildIcs = ({ title, description, start, allDay }) => {
      const end = allDay
        ? new Date(start.getFullYear(), start.getMonth(), start.getDate() + 1)
        : new Date(start.getTime() + 2 * 60 * 60 * 1000);
      const now = new Date();
      const uid = `${allDay ? formatIcsDay(start) : formatIcsDate(start)}-${slugify(title)}@criatinaluz`;
      const dateLines = allDay
        ? [`DTSTART;VALUE=DATE:${formatIcsDay(start)}`, `DTEND;VALUE=DATE:${formatIcsDay(end)}`]
        : [`DTSTART;TZID=Europe/Lisbon:${formatIcsDate(start)}`, `DTEND;TZID=Europe/Lisbon:${formatIcsDate(end)}`];

      return [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Cria Ti na Luz//Cronograma Portugal 2026//PT',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'BEGIN:VEVENT',
        `UID:${uid}`,
        `DTSTAMP:${formatIcsDate(now)}Z`,
        ...dateLines,
        `SUMMARY:${escapeIcs(title)}`,
        `DESCRIPTION:${escapeIcs(description)}`,
        `LOCATION:${escapeIcs(location)}`,
        `CATEGORIES:${escapeIcs(calendarName)}`,
        'END:VEVENT',
        'END:VCALENDAR'
      ].join('\r\n');
    };

    const downloadCalendarFile = (eventData) => {
      const ics = buildIcs(eventData);
      const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${slugify(eventData.title)}.ics`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
    };

    document.querySelectorAll('.card').forEach((card) => {
      const dateText = card.querySelector('.card-date')?.textContent.trim();
      const timeText = card.querySelector('.pill-hora')?.textContent.trim();
      const titleText = card.querySelector('.card-tema')?.textContent.trim();
      const descText = card.querySelector('.card-desc')?.textContent.trim();
      const cardTop = card.querySelector('.card-top');
      const eventDate = parseEventDate(dateText, timeText);

      if (!cardTop || !eventDate || !titleText) return;

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'calendar-button';
      button.textContent = calendarButtonText;
      button.addEventListener('click', () => {
        downloadCalendarFile({
          title: `${calendarName}: ${titleText}`,
          description: `${dateText} · ${timeText || 'Horário a confirmar'}\\n${descText || ''}`,
          start: eventDate.start,
          allDay: eventDate.allDay
        });
      });

      cardTop.appendChild(button);
    });
  })();
</script>

</body>
